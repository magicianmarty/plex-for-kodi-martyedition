name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kodi 19/20 ship Python 3.8, Kodi 21 ships 3.11 - those two are the
          # ones an add-on actually runs on. 3.13 is there so the suite keeps
          # working on a current dev machine. setup-python has no 3.8 build for
          # ubuntu-24.04, hence the pinned runner.
          - {name: "py3.8 (Kodi 19/20)", python: "3.8", os: ubuntu-22.04}
          - {name: "py3.11 (Kodi 21)", python: "3.11", os: ubuntu-latest}
          - {name: "py3.13", python: "3.13", os: ubuntu-latest}
          # Kodi on Windows is a first-class target and the addon does its own
          # path handling; run one leg there so separators cannot rot.
          - {name: "py3.11 windows", python: "3.11", os: windows-latest}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt

      - run: python -m pytest -q --junitxml=junit.xml

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.python }}-${{ matrix.os }}
          path: junit.xml

  compile:
    name: byte-compile on Kodi's oldest Python
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # Most of lib/windows/ needs a real Kodi window manager and so is never
      # imported by the suite. Compiling it is the cheapest guard against
      # shipping a file that cannot even be parsed on a Kodi 19 box.
      - run: python -m compileall -q lib default.py plugin.py service.py screensaver.py

  lint:
    name: flake8 (errors only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install flake8
      - run: python -m flake8 --count .
